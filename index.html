    <script>
      // Kompatibilitas ekstensi browser (mencegah error "Cannot set property fetch of #<Window> which has only a getter")
      try {
        var _origFetch = window.fetch;
        var _currFetch = _origFetch;
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get: function() {
            return _currFetch;
          },
          set: function(fn) {
            _currFetch = fn;
          }
        });
      } catch (err) {
        // Fallback aman jika browser tidak mengizinkan redefinisi properti window.fetch
      }

      // Tangkap event instalasi browser bawaan (Chrome/Edge/Android) sedini mungkin
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function() {
        window.__pwaInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
    </script>
